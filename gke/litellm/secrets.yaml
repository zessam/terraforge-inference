# Identity and secrets for LiteLLM.
#
# Secret Manager is the only place a value is ever set. Terraform creates the
# secret containers; you fill them. External Secrets Operator reads them and
# keeps the matching Kubernetes Secrets in sync, so nothing is copied by hand.
#
# A Kubernetes Secret still has to exist because the chart takes Secret
# references (masterKey.secretName, database.writer.passwordSecret,
# redis.passwordSecret, envSecrets) and cannot read a mounted file. ESO makes it
# a derived copy rather than a place a credential lives.
#
# Auth is Workload Identity. Terraform already granted this exact principal
# per-secret roles/secretmanager.secretAccessor:
#   serviceAccount:trisec-lab.svc.id.goog[llm-system/litellm]
# so no key file exists anywhere.

# Used by the gateway, the backend, the migrations Job, and the SecretStore
# below. Not created by the chart, because the SecretStore needs it too.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm
  namespace: llm-system
  annotations:
    iam.gke.io/gcp-service-account: terraforge-dev-litellm@trisec-lab.iam.gserviceaccount.com

---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: llm-system
spec:
  provider:
    gcpsm:
      projectID: trisec-lab
      auth:
        workloadIdentity:
          clusterProjectID: trisec-lab
          clusterLocation: europe-west8-a # zonal cluster, so the zone
          clusterName: terraforge-dev-gke
          serviceAccountRef:
            name: litellm

# The admin key. Reaches the pods as LITELLM_MASTER_KEY.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-masterkey
  namespace: llm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: litellm-masterkey
  data:
    - secretKey: masterkey
      remoteRef:
        key: terraforge-dev-litellm-master-key

# Cloud SQL. Only the password is secret; the username is fixed by Terraform, so
# it is templated in rather than given a Secret Manager entry of its own.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db
  namespace: llm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: litellm-db
    template:
      engineVersion: v2
      data:
        username: litellm
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: terraforge-dev-db-password

# Memorystore AUTH string.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-redis
  namespace: llm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: litellm-redis
  data:
    - secretKey: password
      remoteRef:
        key: terraforge-dev-redis-password

# Everything the proxy reads from its environment. Each key here is usable in
# the proxy config as os.environ/<KEY>.
#
# LITELLM_SALT_KEY encrypts provider credentials stored in Postgres. Changing it
# makes every model already registered unreadable, which is why it is only ever
# read from Secret Manager, never generated.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-env
  namespace: llm-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: litellm-env
  data:
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: terraforge-dev-litellm-salt-key
    # The keys LiteLLM presents to the RunPod backends. Generated by Terraform,
    # so they resolve today; start vLLM and the embedding server with the same
    # values. Referenced from the model list as os.environ/VLLM_API_KEY and
    # os.environ/EMBEDDING_API_KEY once those models are added at step 20.
    - secretKey: VLLM_API_KEY
      remoteRef:
        key: terraforge-dev-vllm-api-key
    - secretKey: EMBEDDING_API_KEY
      remoteRef:
        key: terraforge-dev-embedding-api-key
    # OpenTelemetry export to Langfuse. Uncomment together with the "otel"
    # callback in values.yaml — a configured callback with no endpoint stops the
    # proxy from starting.
    #
    # OTEL_HEADERS carries HTTP Basic auth built from the Langfuse project keys:
    #
    #   printf 'pk-lf-...:sk-lf-...' | base64 -w0
    #   printf 'Authorization=Basic <that>' | gcloud secrets create \
    #     terraforge-dev-langfuse-otel-headers --data-file=- --project trisec-lab
    #
    # The keys come from the Langfuse UI after first login, which is why
    # Terraform cannot generate them.
    # - secretKey: OTEL_EXPORTER
    #   remoteRef:
    #     key: terraforge-dev-langfuse-otel-exporter   # value: otlp_http
    # - secretKey: OTEL_ENDPOINT
    #   remoteRef:
    #     key: terraforge-dev-langfuse-otel-endpoint   # http://langfuse-web.observability:3000/api/public/otel
    # - secretKey: OTEL_HEADERS
    #   remoteRef:
    #     key: terraforge-dev-langfuse-otel-headers
