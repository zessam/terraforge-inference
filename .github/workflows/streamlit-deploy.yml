name: Streamlit Deploy

# Builds the chat UI image into Artifact Registry and rolls it out.
#
# Unlike the other deploy pipelines, this one produces an artifact, so the
# image is pushed by digest and the Deployment is pinned to that digest rather
# than to a moving tag. A rollback is then a real rollback: the same bytes.
on:
  workflow_dispatch:
  push:
    paths:
      - "streamlit/**"
      - "gke/streamlit/**"
      - ".github/workflows/streamlit-deploy.yml"
  pull_request:
    paths:
      - "streamlit/**"
      - "gke/streamlit/**"
      - ".github/workflows/streamlit-deploy.yml"

concurrency:
  group: streamlit-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  NAMESPACE: llm-system
  CLUSTER: terraforge-dev-gke
  CLUSTER_ZONE: europe-west8-a
  REGISTRY: europe-west8-docker.pkg.dev
  IMAGE_PATH: terraforge-dev/streamlit-chat
  CONFTEST_VERSION: 0.56.0

jobs:
  # No cloud credentials.
  validate:
    name: Lint + policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The app is the one place in this repo with real logic, so it gets
      # compiled and linted rather than only rendered.
      - name: Python syntax + lint
        run: |
          python -m py_compile streamlit/app.py
          pip install --quiet ruff==0.8.4
          ruff check streamlit/

      - name: Setup conftest
        run: |
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Conftest
        run: conftest test gke/streamlit/deployment.yaml -p gke/policy

      - name: Build (no push)
        run: docker build -t streamlit-chat:ci streamlit/

  deploy:
    name: Build, push, roll out
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      # Tagged with the commit SHA, then referenced by digest. The SHA tag is
      # for humans reading the registry; the digest is what actually deploys.
      - name: Build and push
        id: build
        run: |
          IMAGE="${REGISTRY}/${{ secrets.GCP_PROJECT_ID }}/${IMAGE_PATH}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" streamlit/
          docker push "${IMAGE}:${GITHUB_SHA}"
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" \
            --format='value(image_summary.digest)')
          echo "ref=${IMAGE}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}@${DIGEST}"

      - name: Get cluster credentials
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          gcloud container clusters get-credentials "$CLUSTER" \
            --zone "$CLUSTER_ZONE" --project "${{ secrets.GCP_PROJECT_ID }}"

      # The gateway Secret is what the app authenticates with; without it the
      # pod starts and every request is rejected, which is a confusing way to
      # find out LiteLLM was never deployed.
      - name: Require the gateway
        run: |
          kubectl -n "$NAMESPACE" get secret litellm-masterkey >/dev/null
          kubectl -n "$NAMESPACE" get svc litellm-gateway >/dev/null

      - name: Roll out
        run: |
          # Substituted before apply, not patched after: applying the
          # placeholder first would briefly schedule a pod against an image
          # that does not exist.
          sed "s|europe-west8-docker.pkg.dev/.*/streamlit-chat:BUILD_PLACEHOLDER|${{ steps.build.outputs.ref }}|" \
            gke/streamlit/deployment.yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" rollout status deployment/streamlit --timeout=5m

      # A LoadBalancer address takes a minute or two to appear, and the whole
      # point of this pipeline is handing back a URL.
      - name: URL
        run: |
          for i in $(seq 1 30); do
            IP=$(kubectl -n "$NAMESPACE" get svc streamlit \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "$IP" ] && break
            sleep 10
          done
          {
            echo "### Streamlit"
            if [ -n "$IP" ]; then
              echo "http://${IP}"
            else
              echo "LoadBalancer IP not assigned yet — \`kubectl -n $NAMESPACE get svc streamlit\`"
            fi
            echo
            echo '```'
            kubectl -n "$NAMESPACE" get svc streamlit litellm-gateway litellm-ui litellm-backend
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
