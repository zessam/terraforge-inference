# One Grafana dashboard, four rows:
#
#   Quality      lm-eval scores          is the model right?
#   Performance  GuideLLM benchmarks     how fast under controlled load?
#   Gateway      LiteLLM /metrics        what callers experience
#   Serving      vLLM engine /metrics    what the GPU is doing right now
#
# Quality and Performance move only when an eval Job runs. Gateway and Serving
# move with live traffic. Mixing them on one dashboard is deliberate: a latency
# number means something different depending on which produced it.
#
# The sidecar in kube-prometheus-stack watches for ConfigMaps labelled
# grafana_dashboard="1" and loads any JSON inside, so this needs no Grafana
# configuration of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-dashboard
  namespace: observability
  labels:
    grafana_dashboard: '1'
data:
  llm-quality-perf.json: "{\n  \"title\": \"LLM Quality & Performance\",\n  \"uid\": \"llm-quality-perf\",\n  \"tags\": [\n    \"llm\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"refresh\": \"30s\",\n  \"time\": {\n    \"from\": \"now-6h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"datasource\",\n        \"type\": \"datasource\",\n        \"query\": \"prometheus\",\n        \"current\": {},\n        \"hide\": 0\n      },\n      {\n        \"name\": \"profile\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"${datasource}\"\n        },\n        \"query\": \"label_values(guidellm_metric, profile)\",\n        \"refresh\": 2,\n        \"includeAll\": true,\n        \"multi\": true,\n        \"current\": {\n          \"text\": \"All\",\n          \"value\": \"$__all\"\n        }\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"type\": \"row\",\n      \"title\": \"Quality \\u2014 lm-eval (is the model right?)\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 0\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Time since last quality run\",\n      \"description\": \"Pushed values never expire, so this is the only panel that tells you whether the scores below are current.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 1\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 604800\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 2592000\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"background\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"time() - max(lm_eval_run_timestamp_seconds)\",\n          \"legendFormat\": \"age\"\n        }\n      ]\n    },\n    {\n      \"type\": \"bargauge\",\n      \"title\": \"Latest score by suite and task\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 6,\n        \"w\": 18,\n        \"x\": 6,\n        \"y\": 1\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"min\": 0,\n          \"max\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"red\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0.3\n              },\n              {\n                \"color\": \"green\",\n                \"value\": 0.6\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"displayMode\": \"gradient\",\n        \"orientation\": \"horizontal\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"lm_eval_score\",\n          \"legendFormat\": \"{{suite}} / {{task}} ({{filter}})\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Score over time\",\n      \"description\": \"Steps, not curves: the value changes only when a new run pushes. A step down after a model or prompt change is the regression you are looking for.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 14,\n        \"x\": 0,\n        \"y\": 7\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"min\": 0,\n          \"max\": 1,\n          \"custom\": {\n            \"lineInterpolation\": \"stepAfter\",\n            \"fillOpacity\": 5,\n            \"pointSize\": 6,\n            \"showPoints\": \"always\"\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"lm_eval_score\",\n          \"legendFormat\": \"{{suite}}/{{task}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"table\",\n      \"title\": \"All quality scores\",\n      \"description\": \"The filter label matters: gsm8k reports exact_match under both strict-match and flexible-extract, and they disagree.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 10,\n        \"x\": 14,\n        \"y\": 7\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"decimals\": 3\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"showHeader\": true\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"lm_eval_score\",\n          \"format\": \"table\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Performance \\u2014 GuideLLM (how fast under controlled load?)\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 15\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Time to first token (mean)\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 0\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"guidellm_metric{metric=\\\"time_to_first_output_token_ms\\\",stat=\\\"mean\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}}\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Inter-token latency (mean)\",\n      \"description\": \"How fast tokens arrive after the first. Perceived typing speed.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"guidellm_metric{metric=\\\"inter_token_latency_ms\\\",stat=\\\"mean\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}}\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Output throughput (mean)\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"guidellm_metric{metric=\\\"output_tokens_per_second\\\",stat=\\\"mean\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}}\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Concurrency reached (mean)\",\n      \"description\": \"How many requests were in flight at once. On the sweep profile this is where capacity shows up.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 16\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"decimals\": 1\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"guidellm_metric{metric=\\\"request_concurrency\\\",stat=\\\"mean\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}}\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"bargauge\",\n      \"title\": \"Request latency by traffic shape \\u2014 p50 / p95 / p99\",\n      \"description\": \"The comparison that matters. A long prompt (RAG) and a long output (code generation) fail in different ways, and one constant-rate benchmark hides both.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 21\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\",\n          \"decimals\": 2\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"displayMode\": \"gradient\",\n        \"orientation\": \"horizontal\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"guidellm_metric{metric=\\\
    \"request_latency\\\",stat=\\\"p50\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}} p50\",\n          \"instant\": true\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"guidellm_metric{metric=\\\"request_latency\\\",stat=\\\"p95\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}} p95\",\n          \"instant\": true\n        },\n        {\n          \"refId\": \"C\",\n          \"expr\": \"guidellm_metric{metric=\\\"request_latency\\\",stat=\\\"p99\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}} p99\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"bargauge\",\n      \"title\": \"Time to first token by traffic shape \\u2014 p50 / p95 / p99\",\n      \"description\": \"TTFT is prefill-bound, so the long-prompt profile should be visibly worse. If it is not, prefill is not your bottleneck.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 9,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 21\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"ms\",\n          \"decimals\": 0\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"displayMode\": \"gradient\",\n        \"orientation\": \"horizontal\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"guidellm_metric{metric=\\\"time_to_first_output_token_ms\\\",stat=\\\"p50\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}} p50\",\n          \"instant\": true\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"guidellm_metric{metric=\\\"time_to_first_output_token_ms\\\",stat=\\\"p95\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}} p95\",\n          \"instant\": true\n        },\n        {\n          \"refId\": \"C\",\n          \"expr\": \"guidellm_metric{metric=\\\"time_to_first_output_token_ms\\\",stat=\\\"p99\\\",profile=~\\\"$profile\\\"}\",\n          \"legendFormat\": \"{{profile}} p99\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"table\",\n      \"title\": \"Full benchmark breakdown\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 10,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 30\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"decimals\": 3\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"showHeader\": true\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"guidellm_metric{profile=~\\\"$profile\\\"}\",\n          \"format\": \"table\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Gateway \\u2014 LiteLLM (what callers experience)\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 40\n      }\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Requests / sec\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 0,\n        \"y\": 41\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"decimals\": 2\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(rate(litellm_proxy_total_requests_metric[5m]))\",\n          \"legendFormat\": \"rps\"\n        }\n      ]\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Error rate\",\n      \"description\": \"Share of client requests that failed. clamp_min avoids a divide-by-zero producing NaN when idle.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 6,\n        \"y\": 41\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percent\",\n          \"decimals\": 2,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 1\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 5\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"background\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"100 * (sum(rate(litellm_proxy_failed_requests_metric[5m])) / clamp_min(sum(rate(litellm_proxy_total_requests_metric[5m])), 1))\",\n          \"legendFormat\": \"error %\"\n        }\n      ]\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"In-flight requests\",\n      \"description\": \"Per-worker queue depth. Rising while rps is flat means the backend is slowing down.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 12,\n        \"y\": 41\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(litellm_in_flight_requests)\",\n          \"legendFormat\": \"in flight\"\n        }\n      ]\n    },\n    {\n      \"type\": \"stat\",\n      \"title\": \"Backend health\",\n      \"description\": \"litellm_deployment_state: 0 healthy, 1 partial, 2 complete outage. Worst backend wins.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 5,\n        \"w\": 6,\n        \"x\": 18,\n        \"y\": 41\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"0\": {\n                  \"text\": \"healthy\",\n                  \"color\": \"green\"\n                },\n                \"1\": {\n                  \"text\": \"partial\",\n                  \"color\": \"orange\"\n                },\n                \"2\": {\n                  \"text\": \"outage\",\n                  \"color\": \"red\"\n                }\n              }\n            }\n          ],\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              }\n            ]\n          }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"colorMode\": \"background\"\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"max(litellm_deployment_state)\",\n          \"legendFormat\": \"state\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Requests by model\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 46\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (model) (rate(litellm_proxy_total_requests_metric[5m]))\",\n          \"legendFormat\": \"{{model}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Failures by reason\",\n      \"description\": \"Splitting failures by status tells you whether callers are being rejected (401/429) or the backend is breaking (5xx).\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 46\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"stacking\": {\n              \"mode\": \"normal\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (exception_status) (rate(litellm_proxy_failed_requests_metric[5m]))\",\n          \"legendFormat\": \"{{exception_status}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Total request latency (p50 / p95 / p99)\",\n      \"description\": \"End to end, as the caller sees it: gateway overhead plus time in the model.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 54\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"histogram_quantile(0.50, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\"\
    : \"histogram_quantile(0.95, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))\",\n          \"legendFormat\": \"p95\"\n        },\n        {\n          \"refId\": \"C\",\n          \"expr\": \"histogram_quantile(0.99, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le))\",\n          \"legendFormat\": \"p99\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Gateway overhead (total p95 \\u2212 model p95)\",\n      \"description\": \"The gap between what the caller waited and what the model took. Growing overhead means queueing, retries, or routing cost \\u2014 not a slower model.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 54\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"histogram_quantile(0.95, sum(rate(litellm_request_total_latency_metric_bucket[5m])) by (le)) - histogram_quantile(0.95, sum(rate(litellm_llm_api_latency_metric_bucket[5m])) by (le))\",\n          \"legendFormat\": \"overhead p95\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"histogram_quantile(0.95, sum(rate(litellm_llm_api_latency_metric_bucket[5m])) by (le))\",\n          \"legendFormat\": \"model p95\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Token throughput\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 62\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(rate(litellm_input_tokens_metric[5m]))\",\n          \"legendFormat\": \"input tok/s\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"sum(rate(litellm_output_tokens_metric[5m]))\",\n          \"legendFormat\": \"output tok/s\"\n        }\n      ]\n    },\n    {\n      \"type\": \"table\",\n      \"title\": \"Spend by key and model\",\n      \"description\": \"Self-hosted models have no per-token price unless one is configured, so this may read zero. It still attributes usage.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 62\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\",\n          \"decimals\": 4\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n        \"showHeader\": true\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (api_key_alias, model) (litellm_spend_metric)\",\n          \"format\": \"table\",\n          \"instant\": true\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Remaining budget by key\",\n      \"description\": \"A key at zero rejects every call, which looks like an outage to whoever holds it.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 7,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 70\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"currencyUSD\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"litellm_remaining_api_key_budget_metric\",\n          \"legendFormat\": \"{{api_key_alias}}\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Cache hit ratio\",\n      \"description\": \"Only meaningful once response caching is enabled in litellm_settings. Flat zero otherwise.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 7,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 70\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"max\": 1,\n          \"min\": 0\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum(rate(litellm_cache_hits_metric[10m])) / clamp_min(sum(rate(litellm_cache_hits_metric[10m])) + sum(rate(litellm_cache_misses_metric[10m])), 1)\",\n          \"legendFormat\": \"hit ratio\"\n        }\n      ]\n    },\n    {\n      \"type\": \"row\",\n      \"title\": \"Serving \\u2014 vLLM engine (what the GPU is doing)\",\n      \"collapsed\": false,\n      \"gridPos\": {\n        \"h\": 1,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 77\n      }\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Requests running vs waiting\",\n      \"description\": \"Waiting above zero means arrivals exceed what the engine can start. Sustained waiting is the signal to scale, not high running.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 78\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"vllm:num_requests_running\",\n          \"legendFormat\": \"running\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"vllm:num_requests_waiting\",\n          \"legendFormat\": \"waiting\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"KV cache utilisation\",\n      \"description\": \"Past ~90% the engine starts preempting: in-flight requests are evicted and recomputed, so latency degrades sharply rather than gracefully.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 78\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"percentunit\",\n          \"min\": 0,\n          \"max\": 1,\n          \"thresholds\": {\n            \"mode\": \"absolute\",\n            \"steps\": [\n              {\n                \"color\": \"green\",\n                \"value\": null\n              },\n              {\n                \"color\": \"orange\",\n                \"value\": 0.8\n              },\n              {\n                \"color\": \"red\",\n                \"value\": 0.9\n              }\n            ]\n          },\n          \"custom\": {\n            \"fillOpacity\": 10,\n            \"thresholdsStyle\": {\n              \"mode\": \"line\"\n            }\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"vllm:kv_cache_usage_perc\",\n          \"legendFormat\": \"kv cache\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Token throughput\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 86\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"rate(vllm:generation_tokens_total[5m])\",\n          \"legendFormat\": \"generated tok/s\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"rate(vllm:prompt_tokens_total[5m])\",\n          \"legendFormat\": \"prompt tok/s\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Time to first token (p50 / p95)\",\n      \"description\": \"What a streaming client perceives as responsiveness. Prefill cost, so it grows with prompt length.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 86\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"histogram_quantile(0.50, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))\",\n          \"legendFormat\": \"p95\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"End-to-end request latency (p50 / p95)\",\n      \"description\": \"Compare against the gateway dashboard's total latency: the difference is gateway overhead.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 94\n      },\n      \"fieldConfig\"\
    : {\n        \"defaults\": {\n          \"unit\": \"s\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"histogram_quantile(0.50, sum(rate(vllm:e2e_request_latency_seconds_bucket[5m])) by (le))\",\n          \"legendFormat\": \"p50\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"histogram_quantile(0.95, sum(rate(vllm:e2e_request_latency_seconds_bucket[5m])) by (le))\",\n          \"legendFormat\": \"p95\"\n        }\n      ]\n    },\n    {\n      \"type\": \"timeseries\",\n      \"title\": \"Request outcomes and preemptions\",\n      \"description\": \"finished_reason=length means the model hit max_tokens rather than finishing. A rise in preemptions means the KV cache is oversubscribed.\",\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"${datasource}\"\n      },\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 94\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"short\",\n          \"custom\": {\n            \"fillOpacity\": 10\n          }\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n          \"expr\": \"sum by (finished_reason) (rate(vllm:request_success_total[5m]))\",\n          \"legendFormat\": \"{{finished_reason}}\"\n        },\n        {\n          \"refId\": \"B\",\n          \"expr\": \"rate(vllm:num_preemptions_total[5m])\",\n          \"legendFormat\": \"preemptions\"\n        }\n      ]\n    }\n  ]\n}"
