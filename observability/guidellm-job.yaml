# PERFORMANCE — GuideLLM. Five traffic shapes, one Job each. Several shapes is
# the point: one constant rate gives a single point, and a single point cannot
# show where latency turns.
#
#   chat-steady          128 in / 128 out, 2 rps   interactive chat
#   rag-longprompt       2048 in / 128 out         retrieval-augmented answers
#   codegen-longoutput   256 in / 1024 out         code generation
#   burst-poisson        bursty arrivals           real traffic, not a metronome
#   sweep-capacity       ramps until flat          finds the knee
#
# TTFT is prefill-bound, so rag-longprompt should be visibly worse than
# chat-steady. If it is not, prefill is not your bottleneck.
#
#   kubectl create -n observability -f observability/guidellm-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  namespace: observability
  labels:
    app.kubernetes.io/part-of: llm-observability
    app.kubernetes.io/component: eval
    eval/kind: guidellm
    eval/name: burst-poisson
  generateName: guidellm-burst-poisson-
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: llm-observability
        app.kubernetes.io/component: eval
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: guidellm
        image: python:3.11-slim
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        env:
        - name: PROFILE
          value: burst-poisson
        - name: RUN_ID
          value: manual
        - name: MODEL
          value: Qwen/Qwen3-8B
        - name: PUSH_URL
          value: http://pushgateway.observability.svc.cluster.local:9091
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-masterkey
              key: masterkey
        command:
        - bash
        - -lc
        args:
        - "set -euo pipefail\n# CPU-only torch FIRST. guidellm pulls torch transitively and pip\n# otherwise resolves the CUDA build \u2014 several GB of wheels and a\n# long silent install.\n# A venv rather than `pip --target`: --target refuses to overwrite a\n# directory that already exists, so the second install skipped bin/ and\n# guidellm's entry point was never written -- the Job died with exit 127\n# and \"guidellm: command not found\". A venv also lets the second install\n# see the CPU torch from the first, so torch is not re-resolved to the\n# multi-GB CUDA build the comment above is guarding against.\npython -m venv /tmp/venv\n/tmp/venv/bin/pip install --quiet torch \\\n  --index-url https://download.pytorch.org/whl/cpu\n/tmp/venv/bin/pip install --quiet \\\n  \"guidellm==0.7.1\" \\\n  \"tracerite<2.6\"\nexport PATH=/tmp/venv/bin:$PATH\n\nguidellm run \\\n  --backend \"kind=openai_http,target=http://litellm-gateway.llm-system.svc.cluster.local:4000,model=Qwen/Qwen3-8B,api_key=$LITELLM_API_KEY\" \\\n  --profile \"kind=poisson,rate=4\" \\\n  --constraint \"kind=max_duration,seconds=120\" \\\n  --data \"kind=synthetic_text,prompt_tokens=128,output_tokens=128\" \\\n  --output \"kind=json,path=/tmp/guidellm.json\"\n\n# Never fails the Job: the load itself is already recorded in the\n# gateway and engine metrics, so a failed push loses the summary,\n# not the run.\npython /scripts/push_guidellm.py \\\n  || echo \"push failed; the load is still visible in serving metrics\"\n"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: tmp
          mountPath: /tmp
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 512Mi
      volumes:
      - name: scripts
        configMap:
          name: eval-scripts
      - name: tmp
        emptyDir:
          sizeLimit: 8Gi
---
